# This GitHub Action is designed to deploy the code bases from specified branch to an Azure WebApp

name: 'Deploy Azure WebApp'
description: 'This custom GitHub Actions module deploys from defined source to defined Azure WebApp microservice'

# Define the inputs required for this action.
inputs:
  credentials:
    description: 'Azure subscription and resource group service principal'
    required: true
  branch:
    description: 'Source Git branch, main if none specified'
    required: false
    default: 'main'
  sha:
    description: 'Commit SHA used for deployment artefacts and slots'
    required: false
  region:
    description: 'Azure region'
    required: true
  group:
    description: 'Azure resource group'
    required: true
  acr:
    description: 'Azure container registry password'
    required: true
  webapp:
    description: 'Azure WebApp name'
    required: true

# Define the steps to run this action.
runs:
  using: 'composite'
  steps:
    # Step 1: Check out the repository.
    - name: Repository 🗃️
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}

    # Step 2: Get Deployment SHA
    - name: Deployment SHA 🏷️
      run: |
        if [ -n "${{ inputs.sha }}" ]; then
          echo "DEPLOYMENT_SHA=${{ inputs.sha }}" >> "$GITHUB_ENV"
        else
         echo "DEPLOYMENT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
        fi
      shell: bash

    # Step 3: Create Azure CLI directory with proper permissions
    - name: Azure CLI Setup 🛠️
      run: |
        # Ensure .azure directory exists with proper permissions
        mkdir -p $HOME/.azure
        chmod 755 $HOME/.azure
        # Clear any existing problematic cache files
        rm -f $HOME/.azure/msal_token_cache.json
        rm -f $HOME/.azure/msal_token_cache.json.lock
        # Set proper umask for file creation
        umask 022
      shell: bash

    # Step 4: Log in to Azure.
    - name: Azure 🔐
      uses: azure/login@v3
      with:
        creds: ${{ inputs.credentials }}

    # Step 5: Set up Azure CLI defaults.
    - name: Defaults ✨
      uses: azure/cli@v3
      with:
        inlineScript: |
          # Basic
          az configure --defaults location=${{ inputs.region }}
          az configure --defaults group=${{ inputs.group }}

    # Step 6: Set environment variables for ACR and WebApp.
    - name: CLI 📝
      run: |
        echo ACR=$(az acr show -n $(az resource list --resource-type 'Microsoft.ContainerRegistry/registries' --query '[0].name' -o tsv) --query loginServer -o tsv) >> $GITHUB_ENV
        echo ACR_USER=$(az acr show -n $(az resource list --resource-type 'Microsoft.ContainerRegistry/registries' --query '[0].name' -o tsv) --query name -o tsv) >> $GITHUB_ENV
        echo WEBAPP=$(az resource list --resource-type 'Microsoft.Web/sites' --query '[?contains(name, `${{ inputs.webapp }}`)].name' -o tsv) >> $GITHUB_ENV
      shell: bash

    # Step 7: Log in to Azure Container Registry.
    - name: ACR 🔐
      uses: azure/docker-login@v2
      with:
        login-server: ${{ env.ACR }}
        username: ${{ env.ACR_USER }}
        password: ${{ inputs.acr }}

    # Step 8: Build and push Docker images.
    - name: Artefacts 🗃️
      working-directory: .
      run: |
        # Build images
        docker build -f ./${{ inputs.webapp }}/Dockerfile . \
        -t ${{ env.ACR }}/${{ inputs.webapp }}:${{ env.DEPLOYMENT_SHA }} \
        -t ${{ env.ACR }}/${{ inputs.webapp }}:latest \
        --build-arg GITHUB_SHA=${{ env.DEPLOYMENT_SHA }}
        # Push images
        docker push ${{ env.ACR }}/${{ inputs.webapp }}:${{ env.DEPLOYMENT_SHA }}
        docker push ${{ env.ACR }}/${{ inputs.webapp }}:latest
      shell: bash

    # Step 9: Create and swap deployment slot.
    - name: Slot 🔀
      uses: azure/cli@v3
      with:
        inlineScript: |
          # Create new temporary slot
          az webapp deployment slot create \
          --slot ${{ env.DEPLOYMENT_SHA }} \
          --name ${{ env.WEBAPP }} \
          --configuration-source ${{ env.WEBAPP }} \
          --deployment-container-image-name ${{ env.ACR }}/${{ inputs.webapp }}:latest \
          --docker-registry-server-user ${{ env.ACR_USER }} \
          --docker-registry-server-password ${{ inputs.acr }}
          # Swap slot
          az webapp deployment slot swap \
          --slot ${{ env.DEPLOYMENT_SHA }} \
          --name ${{ env.WEBAPP }} \
          --action swap

    # Step 10: Cleanup temporary slot.
    - name: Cleanup 🧹
      if: always()
      uses: azure/cli@v3
      with:
        inlineScript: |
          # Delete temporary slot
          az webapp deployment slot delete \
          --slot ${{ env.DEPLOYMENT_SHA }} \
          --name ${{ env.WEBAPP }}