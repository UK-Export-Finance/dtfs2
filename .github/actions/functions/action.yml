# This GitHub Action is designed to deploy the code bases from specified branch to an Azure Functions

name: 'Deploy Azure Functions'
description: 'This custom GitHub Actions module deploys from defined source to defined Azure Functions microservice'

# Define the inputs required for this action.
inputs:
  credentials:
    description: 'Azure subscription and resource group service principal'
    required: true
  branch:
    description: 'Source Git branch, main if none specified'
    required: false
    default: 'main'
  sha:
    description: 'Commit SHA used for deployment artefacts and slots'
    required: false
  region:
    description: 'Azure region'
    required: true
  group:
    description: 'Azure resource group'
    required: true
  acr:
    description: 'Azure container registry password'
    required: true
  functions:
    description: 'Azure Functions name'
    required: true

# Define the steps to run this action.
runs:
  using: 'composite'
  steps:
    # Step 1: Check out the repository.
    - name: Repository 🗃️
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}

    # Step 2: Get Deployment SHA
    - name: Deployment SHA 🏷️
      run: |
        if [ -n "${{ inputs.sha }}" ]; then
          echo "DEPLOYMENT_SHA=${{ inputs.sha }}" >> "$GITHUB_ENV"
        else
         echo "DEPLOYMENT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
        fi
      shell: bash

    # Step 3: Set up Azure CLI defaults.
    - name: Defaults ✨
      uses: azure/cli@v3
      with:
        inlineScript: |
          # Basic
          az configure --defaults location=${{ inputs.region }}
          az configure --defaults group=${{ inputs.group }}

    # Step 3: Log in to Azure.
    - name: Azure 🔐
      uses: azure/login@v3
      with:
        creds: ${{ inputs.credentials }}

    # Step 4: Set environment variables for ACR and function.
    - name: CLI 📝
      run: |
        echo ACR=$(az acr show -n $(az resource list --resource-type 'Microsoft.ContainerRegistry/registries' --query '[0].name' -o tsv) --query loginServer -o tsv) >> $GITHUB_ENV
        echo ACR_USER=$(az acr show -n $(az resource list --resource-type 'Microsoft.ContainerRegistry/registries' --query '[0].name' -o tsv) --query name -o tsv) >> $GITHUB_ENV
        echo FUNCTION=$(az resource list --resource-type 'Microsoft.Web/sites' --query '[?contains(name, `${{ inputs.functions }}`)].name' -o tsv) >> $GITHUB_ENV
      shell: bash

    # Step 5: Log in to Azure Container Registry.
    - name: ACR 🔐
      uses: azure/docker-login@v2
      with:
        login-server: ${{ env.ACR }}
        username: ${{ env.ACR_USER }}
        password: ${{ inputs.acr }}

    # Step 6: Build and push Docker images.
    - name: Artefacts 🗃️
      working-directory: .
      run: |
        # Build images
        docker build -f ./azure-functions/${{ inputs.functions }}/Dockerfile . \
        -t ${{ env.ACR }}/${{ inputs.functions }}:${{ env.DEPLOYMENT_SHA }} \
        -t ${{ env.ACR }}/${{ inputs.functions }}:latest

        # Push images
        docker push ${{ env.ACR }}/${{ inputs.functions }}:${{ env.DEPLOYMENT_SHA }}
        docker push ${{ env.ACR }}/${{ inputs.functions }}:latest
      shell: bash

    # Step 7: Create and swap deployment slot.
    - name: Slot 🔀
      uses: azure/cli@v3
      with:
        inlineScript: |
          # Create new temporary slot
          az functionapp deployment slot create \
          --slot ${{ env.DEPLOYMENT_SHA }} \
          --name ${{ env.FUNCTION }} \
          --configuration-source ${{ env.FUNCTION }} \
          --deployment-container-image-name ${{ env.ACR }}/${{ inputs.functions }}:latest \
          --docker-registry-server-user ${{ env.ACR_USER }} \
          --docker-registry-server-password ${{ inputs.acr }}

          # Swap slot
          az functionapp deployment slot swap \
          --slot ${{ env.DEPLOYMENT_SHA }} \
          --name ${{ env.FUNCTION }} \
          --action swap

    # Step 8: Cleanup temporary slot.
    - name: Cleanup 🧹
      if: always()
      uses: azure/cli@v3
      with:
        inlineScript: |
          # Delete temporary slot
          az functionapp deployment slot delete \
          --slot ${{ env.DEPLOYMENT_SHA }} \
          --name ${{ env.FUNCTION }}
