# Infrastructure Deployment Workflow
#
# This GitHub Actions workflow automates the deployment of Azure infrastructure
# for the DTFS project. It performs the following main tasks:
#
# 1. Sets up the environment and variables
# 2. Logs in to Azure
# 3. Creates or updates the resource group
# 4. Replaces placeholders in the parameters.json file with actual values from GitHub secrets
# 5. Deploys Azure resources using the Bicep template
#
# The workflow is triggered on pushes to the target branch and uses environment
# variables and secrets for configuration. It's designed to work with the
# main.bicep and parameters.json files in the infrastructure directory.
#
# Note: Ensure all required secrets and variables are set in the GitHub repository
# settings before running this workflow.

name: Infrastructure 🔨
run-name: DTFS base infrastructure build from ${{ github.repository }}

on:
  push:
    branches:
      - dev
      - main
      - staging
      - production
    paths:
      - '.github/workflows/bicep_infrastructure.yml'
      - 'infrastructure/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: environment

env:
  PRODUCT: dtfs2
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
  TIMEZONE: '${{ vars.TIMEZONE }}'
  # Deployment environment target i.e., `development`, `staging`, `production`
  TARGET: ${{ vars.TARGET }}

jobs:
# 1. Setup infrastructure variables
  setup:
    name: Setup 🔧
    runs-on: [self-hosted, linux, deployment]
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
    outputs:
      environment: ${{ env.ENVIRONMENT }}
      timezone: ${{ env.TIMEZONE }}
    steps:
      - name: Repository 🗃️
        uses: actions/checkout@v7

      - name: Environment 🧪
        run: echo "Environment set to ${{ env.ENVIRONMENT }}"

      - name: Timezone 🌐
        run: echo "Timezone set to ${{ env.TIMEZONE }}"

      - name: Login 🔐
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_DEV_CREDENTIALS }}

      - name: Verify Azure subscription 🧭
        run: |
          az account set --subscription "${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}"
          ACTIVE_SUBSCRIPTION=$(az account show --query id -o tsv)
          if [ "$ACTIVE_SUBSCRIPTION" != "${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}" ]; then
            echo "Expected subscription ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}, but active subscription is $ACTIVE_SUBSCRIPTION"
            exit 1
          fi
          echo "Active subscription: $ACTIVE_SUBSCRIPTION"
          echo "Active subscription name: $(az account show --query name -o tsv)"
          echo "Target resource group: rg-${{ env.PRODUCT }}-${{ env.TARGET }}-${{ vars.VERSION }}"

      - name: Azure defaults ✨
        uses: azure/cli@v3
        with:
          inlineScript: |
            # Basic
            az configure --defaults location=${{ vars.REGION }}
            az configure --defaults group=rg-${{ env.PRODUCT }}-${{ env.TARGET }}-${{ vars.VERSION }}

      - name: Create Resource group 🏗️
        uses: azure/cli@v3
        with:
          inlineScript: |
            az group create \
            --location ${{ vars.REGION }} \
            --name rg-${{ env.PRODUCT }}-${{ env.TARGET }}-${{ vars.VERSION }}

      - name: Set Resource Group Name
        run: echo "RESOURCE_GROUP_NAME=rg-${{ env.PRODUCT }}-${{ env.TARGET }}-${{ vars.VERSION }}" >> $GITHUB_ENV

# 2. Validate infrastructure resources
  Resource-Deploy:
    name: Deploy Resources 📊
    needs: setup
    runs-on: [self-hosted, linux, deployment]
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
    steps:
      - name: Repository 🗃️
        uses: actions/checkout@v7

      - name: Login 🔐
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_DEV_CREDENTIALS }}

      - name: Verify Azure subscription 🧭
        run: |
          az account set --subscription "${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}"
          ACTIVE_SUBSCRIPTION=$(az account show --query id -o tsv)
          if [ "$ACTIVE_SUBSCRIPTION" != "${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}" ]; then
            echo "Expected subscription ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}, but active subscription is $ACTIVE_SUBSCRIPTION"
            exit 1
          fi
          echo "Active subscription: $ACTIVE_SUBSCRIPTION"
          echo "Active subscription name: $(az account show --query name -o tsv)"
          echo "Target resource group: rg-${{ env.PRODUCT }}-${{ env.TARGET }}-${{ vars.VERSION }}"

      - name: Set bicep properties ✨
        id: bicep-parameters
        run: |
          set -a
          UKEF_VPN_IPS="${{ secrets.UKEF_VPN_IPS }}"
          UKEF_VPN_IPS="${UKEF_VPN_IPS// /}"
          AZ_PORTAL_IPS="${{ secrets.AZ_PORTAL_IPS }}"
          AZ_PORTAL_IPS="${AZ_PORTAL_IPS// /}"
          NSG_SOURCE_ADDRESS_PREFIX="${{ vars.NSG_SOURCE_ADDRESS_PREFIX }}"
          NSG_SOURCE_ADDRESS_PREFIX="${NSG_SOURCE_ADDRESS_PREFIX// /}"
          UKEF_SOURCE_ADDRESS_PREFIX="${{ vars.UKEF_SOURCE_ADDRESS_PREFIX }}"
          UKEF_SOURCE_ADDRESS_PREFIX="${UKEF_SOURCE_ADDRESS_PREFIX// /}"
          TEST_SOURCE_ADDRESS_PREFIX="${{ vars.TEST_SOURCE_ADDRESS_PREFIX }}"
          TEST_SOURCE_ADDRESS_PREFIX="${TEST_SOURCE_ADDRESS_PREFIX// /}"
          UTILISATION_REPORT_CREATION_FOR_BANKS_SCHEDULE="${{ secrets.UTILISATION_REPORT_CREATION_FOR_BANKS_SCHEDULE }}"
          UTILISATION_REPORT_SUBMISSION_PERIOD_START_EMAIL_SCHEDULE="${{ vars.UTILISATION_REPORT_SUBMISSION_PERIOD_START_EMAIL_SCHEDULE }}"
          UTILISATION_REPORT_OVERDUE_EMAIL_SCHEDULE="${{ vars.UTILISATION_REPORT_OVERDUE_EMAIL_SCHEDULE }}"
          UTILISATION_REPORT_DUE_EMAIL_SCHEDULE="${{ vars.UTILISATION_REPORT_DUE_EMAIL_SCHEDULE }}"
          AZURE_NUMBER_GENERATOR_FUNCTION_SCHEDULE="${{ secrets.AZURE_NUMBER_GENERATOR_FUNCTION_SCHEDULE }}"
          ESTORE_CRON_MANAGER_SCHEDULE="${{ vars.ESTORE_CRON_MANAGER_SCHEDULE }}"
          ACBS_DURABLE_FUNCTIONS_LOG_DELETION_SCHEDULE="${{ secrets.ACBS_DURABLE_FUNCTIONS_LOG_DELETION_SCHEDULE }}"
          DEAL_CANCELLATION_SCHEDULE="${{ vars.DEAL_CANCELLATION_SCHEDULE }}"
          RECORD_CORRECTION_TRANSIENT_FORM_DATA_DELETE_SCHEDULE="${{ vars.RECORD_CORRECTION_TRANSIENT_FORM_DATA_DELETE_SCHEDULE }}"
          TIME_ZONE="${{ vars.TIMEZONE }}"
          GOV_NOTIFY_EMAIL_RECIPIENT="${{ secrets.GOV_NOTIFY_EMAIL_RECIPIENT }}"
          PDC_INPUTTERS_EMAIL_RECIPIENT="${{ secrets.PDC_INPUTTERS_EMAIL_RECIPIENT }}"
          UKEF_GEF_REPORTING_EMAIL_RECIPIENT="${{ secrets.UKEF_GEF_REPORTING_EMAIL_RECIPIENT }}"
          VERSION="${{ vars.VERSION || 'v1' }}"
          RATE_LIMIT_THRESHOLD="${{ secrets.RATE_LIMIT_THRESHOLD }}"
          APIM_TFS_KEY="${{ secrets.APIM_TFS_KEY }}"
          APIM_TFS_VALUE="${{ secrets.APIM_TFS_VALUE }}"
          APIM_TFS_URL="${{ secrets.APIM_TFS_URL }}"
          APIM_MDM_KEY="${{ secrets.APIM_MDM_KEY }}"
          APIM_MDM_URL="${{ secrets.APIM_MDM_URL }}"
          APIM_MDM_VALUE="${{ secrets.APIM_MDM_VALUE }}"
          DTFS_CENTRAL_API_KEY="${{ secrets.DTFS_CENTRAL_API_KEY }}"
          COMPANIES_HOUSE_API_URL="${{ secrets.COMPANIES_HOUSE_API_URL }}"
          ORDNANCE_SURVEY_API_URL="${{ secrets.ORDNANCE_SURVEY_API_URL }}"
          CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}"
          APIM_ESTORE_URL="${{ secrets.APIM_ESTORE_URL }}"
          APIM_ESTORE_KEY="${{ secrets.APIM_ESTORE_KEY }}"
          APIM_ESTORE_VALUE="${{ secrets.APIM_ESTORE_VALUE }}"
          COMPANIES_HOUSE_API_KEY="${{ secrets.COMPANIES_HOUSE_API_KEY }}"
          ORDNANCE_SURVEY_API_KEY="${{ secrets.ORDNANCE_SURVEY_API_KEY }}"
          GOV_NOTIFY_API_KEY="${{ secrets.GOV_NOTIFY_API_KEY }}"
          EXTERNAL_API_KEY="${{ secrets.EXTERNAL_API_KEY }}"
          PORTAL_UI_URL="${{ vars.PORTAL_UI_URL }}"
          TFM_API_KEY="${{ secrets.TFM_API_KEY }}"
          UTILISATION_REPORT_DUE_DATE_BUSINESS_DAYS_FROM_START_OF_MONTH="${{ vars.UTILISATION_REPORT_DUE_DATE_BUSINESS_DAYS_FROM_START_OF_MONTH }}"
          UTILISATION_REPORT_OVERDUE_CHASER_DATE_BUSINESS_DAYS_FROM_START_OF_MONTH="${{ vars.UTILISATION_REPORT_OVERDUE_CHASER_DATE_BUSINESS_DAYS_FROM_START_OF_MONTH }}"
          AZURE_UTILISATION_REPORTS_FILESHARE_NAME="${{ vars.AZURE_UTILISATION_REPORTS_FILESHARE_NAME }}"
          AZURE_PORTAL_EXPORT_FOLDER="${{ secrets.AZURE_PORTAL_EXPORT_FOLDER }}"
          AZURE_PORTAL_FILESHARE_NAME="${{ secrets.AZURE_PORTAL_FILESHARE_NAME }}"
          JWT_SIGNING_KEY="${{ secrets.JWT_SIGNING_KEY }}"
          JWT_VALIDATING_KEY="${{ secrets.JWT_VALIDATING_KEY }}"
          PORTAL_API_KEY="${{ secrets.PORTAL_API_KEY }}"
          PORTAL_API_URL="${{ vars.PORTAL_API_URL }}"
          UTILISATION_REPORT_MAX_FILE_SIZE_BYTES="${{ vars.UTILISATION_REPORT_MAX_FILE_SIZE_BYTES }}"
          SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
          ESTORE_URL="${{ secrets.ESTORE_URL }}"
          UKEF_TFM_API_SYSTEM_KEY="${{ secrets.UKEF_TFM_API_SYSTEM_KEY }}"
          UKEF_TFM_API_REPORTS_KEY="${{ secrets.UKEF_TFM_API_REPORTS_KEY }}"
          UKEF_INTERNAL_NOTIFICATION="${{ secrets.UKEF_INTERNAL_NOTIFICATION }}"
          AZURE_DNS_SERVER_IP="${{ secrets.AZURE_DNS_SERVER_IP }}"
          WEBSITE_HTTPLOGGING_RETENTION_DAYS="${{ vars.WEBSITE_HTTPLOGGING_RETENTION_DAYS }}"
          WEBSITE_DYNAMIC_CACHE="${{ vars.WEBSITE_DYNAMIC_CACHE }}"
          WEBSITE_NODE_DEFAULT_VERSION="${{ vars.WEBSITE_NODE_DEFAULT_VERSION }}"
          WEBSITE_HEALTHCHECKING_MAX="${{ vars.WEBSITE_HEALTHCHECKING_MAX }}"
          REDIRECT_URL="${{ vars.REDIRECT_URL }}"
          ASP_SKU="${{ vars.ASP_SKU }}"
          CONTACT_US_EMAIL_ADDRESS="${{ vars.CONTACT_US_EMAIL_ADDRESS }}"
          DEAL_API_URL="${{ vars.DEAL_API_URL }}"
          FF_FEE_RECORD_CORRECTION_ENABLED="${{ vars.FF_FEE_RECORD_CORRECTION_ENABLED }}"
          FF_PORTAL_2FA_ENABLED="${{ vars.FF_PORTAL_2FA_ENABLED }}"
          FF_PORTAL_FACILITY_AMENDMENTS_ENABLED="${{ vars.FF_PORTAL_FACILITY_AMENDMENTS_ENABLED }}"
          FF_TFM_DEAL_CANCELLATION_ENABLED="${{ vars.FF_TFM_DEAL_CANCELLATION_ENABLED }}"
          MAINTENANCE_ACTIVE="${{ vars.MAINTENANCE_ACTIVE }}"
          MAINTENANCE_TIMESTAMP="${{ vars.MAINTENANCE_TIMESTAMP }}"
          CHANGE_STREAM_ENABLED="${{ vars.CHANGE_STREAM_ENABLED }}"
          GEF_DEAL_VERSION="${{ vars.GEF_DEAL_VERSION }}"
          TFM_API="${{ vars.TFM_API }}"
          TFM_UI_URL="${{ vars.TFM_UI_URL }}"
          DELETION_AUDIT_LOGS_TTL_SECONDS="${{ vars.DELETION_AUDIT_LOGS_TTL_SECONDS }}"
          AUDIT_API_PASSWORD="${{ secrets.AUDIT_API_PASSWORD }}"
          AUDIT_API_URL="${{ secrets.AUDIT_API_URL }}"
          AUDIT_API_USERNAME="${{ secrets.AUDIT_API_USERNAME }}"
          DTFS_CENTRAL_API_URL="${{ vars.DTFS_CENTRAL_API_URL }}"
          EXTERNAL_API_URL="${{ vars.EXTERNAL_API_URL }}"
          SQL_DB_HOST="${{ secrets.SQL_DB_HOST }}"
          SQL_DB_NAME="${{ secrets.SQL_DB_NAME }}"
          SQL_DB_PASSWORD="${{ secrets.SQL_DB_PASSWORD }}"
          SQL_DB_USERNAME="${{ secrets.SQL_DB_USERNAME }}"
          SQL_DB_LOGGING_ENABLED="${{ vars.SQL_DB_LOGGING_ENABLED }}"
          SQL_DB_PORT="${{ secrets.SQL_DB_PORT }}"
          TFM_API_URL="${{ vars.TFM_API_URL }}"
          AZURE_ACBS_FUNCTION_URL="${{ vars.AZURE_ACBS_FUNCTION_URL }}"
          CASH_UTILISATION_PERCENTAGE="${{ vars.CASH_UTILISATION_PERCENTAGE }}"
          CONTINGENT_UTILISATION_PERCENTAGE="${{ vars.CONTINGENT_UTILISATION_PERCENTAGE }}"
          ENTRA_ID_CLIENT_ID="${{ vars.ENTRA_ID_CLIENT_ID }}"
          ENTRA_ID_TENANT_ID="${{ vars.ENTRA_ID_TENANT_ID }}"
          ENTRA_ID_CLIENT_SECRET="${{ vars.ENTRA_ID_CLIENT_SECRET }}"
          ENTRA_ID_CLOUD_INSTANCE="${{ vars.ENTRA_ID_CLOUD_INSTANCE }}"
          ENTRA_ID_REDIRECT_URL="${{ vars.ENTRA_ID_REDIRECT_URL }}"
          FF_SALESFORCE_CUSTOMER_CREATION_ENABLED="${{ vars.FF_SALESFORCE_CUSTOMER_CREATION_ENABLED }}"
          FF_TFM_FACILITY_END_DATE_ENABLED="${{ vars.FF_TFM_FACILITY_END_DATE_ENABLED }}"
          CONTACT_US_SELF_SERVICE_PORTAL_URL="${{ vars.CONTACT_US_SELF_SERVICE_PORTAL_URL }}"
          FF_TFM_PAYMENT_RECONCILIATION_ENABLED="${{ vars.FF_TFM_PAYMENT_RECONCILIATION_ENABLED }}"
          set +a

          PARAMETERS_FILE="$RUNNER_TEMP/bicep-parameters.json"
          export PARAMETERS_FILE
          node <<'NODE'
          const fs = require('fs');
          const templatePath = 'infrastructure/resource_group_level/parameters_dev.json';
          const outputPath = process.env.PARAMETERS_FILE;
          const template = fs.readFileSync(templatePath, 'utf8');
          const rendered = template.replace(/\{\{([A-Z0-9_]+)\}\}/g, (_, key) => {
            const value = process.env[key];
            return value === undefined ? '' : JSON.stringify(value).slice(1, -1);
          });
          fs.writeFileSync(outputPath, rendered);
          NODE

          echo "parameters_file=$PARAMETERS_FILE" >> $GITHUB_OUTPUT

      - name: Install Bicep
        run: |
          az config set bicep.use_binary_from_path=False
          az bicep install
          az bicep upgrade
          az bicep version

      - name: Deploy Azure Resources
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}
          resourceGroupName: rg-${{ env.PRODUCT }}-${{ env.TARGET }}-${{ vars.VERSION }}
          template: ./infrastructure/resource_group_level/main.bicep
          parameters: ${{ steps.bicep-parameters.outputs.parameters_file }}
          scope: resourcegroup

