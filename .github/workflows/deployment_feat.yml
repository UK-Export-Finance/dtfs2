# Feature1 Deployment Workflow
# ****************************
#
# Deploys DTFS components to the Feature1 environment.
#
# Stages:
# 1. Resolve the deployment source and environment.
# 2. Apply SQL database migrations.
# 3. Deploy WebApps.
# 4. Deploy Azure Functions.
# 5. Send the deployment notification.
#
# Environment Variables:
# - `PRODUCT`: The product being deployed (e.g., `dtfs`).
# - `ENVIRONMENT`: The target DTFS environment (`feature`).
# - `TIMEZONE`: The timezone used for deployment logging.

name: Deployment
run-name: 🚀 Deploying to Feature1

concurrency:
  group: deployment-feature
  cancel-in-progress: false

on:
  # schedule:
  #   # Nightly deployment at 23:00 UTC
  #   - cron: '0 23 * * *' # Runs every day at 23:00 UTC

  push:
    branches:
      - feat/DTFS2-25605/test-feature-deployment

  workflow_dispatch:

env:
  PRODUCT: dtfs
  TIMEZONE: ${{ vars.TIMEZONE_LONDON }}
  DEPLOYMENT_BRANCH: feat/DTFS2-25605/test-feature-deployment

jobs:
  # 1. Base actions configurations
  setup:
    name: Setup 🔧
    runs-on: [self-hosted, linux, deployment]
    outputs:
      product: ${{ env.PRODUCT }}
      environment: ${{ steps.environment.outputs.environment }}
      timezone: ${{ env.TIMEZONE }}
      deployment_ref: ${{ steps.source.outputs.deployment_ref }}
      deployment_branch: ${{ steps.source.outputs.deployment_branch }}

    steps:

      - name: Repository 🗂️
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.DEPLOYMENT_BRANCH }}
          fetch-depth: 1
      - name: Environment 🧪
        id: environment
        run: |
          echo "environment=feature" >> "$GITHUB_OUTPUT"


      - name: Deployment Source 🏷️
        id: source
        run: |
          echo "deployment_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "deployment_branch=${{ env.DEPLOYMENT_BRANCH }}" >> "$GITHUB_OUTPUT"
      - name: Timezone 🌐
        run: echo "Timezone set to ${{ env.TIMEZONE }}"

  # 2. Database schema migration
  database:
    name: MSSQL 🗄️
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment }}
    runs-on: [self-hosted, DTFS, deployment]
    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Repository 🗂️
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.deployment_ref }}


      - name: Deploy ⚡
        uses: ./.github/actions/mssql
        with:
          branch: ${{ needs.setup.outputs.deployment_ref }}
          host: ${{ secrets.SQL_DB_HOST }}
          port: ${{ secrets.SQL_DB_PORT }}
          username: ${{ secrets.SQL_DB_USERNAME }}
          password: ${{ secrets.SQL_DB_PASSWORD }}
          database: ${{ secrets.SQL_DB_NAME }}
          node: ${{ vars.NODE_VERSION }}
          log: ${{ vars.SQL_DB_LOGGING_ENABLED }}

  # 3. Micro-services WebApp deployments
  webapp:
    name: WebApp 🌐
    needs: [setup, database]
    environment: ${{ needs.setup.outputs.environment }}
    runs-on: [self-hosted, DTFS, deployment]
    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}

    strategy:
      max-parallel: 1
      # Do not cancel in-progress jobs upon failure
      fail-fast: false
      # Single dimension matrix
      matrix:
        webapp: ['portal-ui', 'gef-ui', 'trade-finance-manager-ui', 'portal-api', 'dtfs-central-api', 'external-api', 'trade-finance-manager-api']



    steps:
      - name: Repository 🗂️
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.deployment_ref }}

      - name: Deploy ⚡
        uses: ./.github/actions/webapp
        with:
          branch: ${{ needs.setup.outputs.deployment_ref }}
          sha: ${{ needs.setup.outputs.deployment_ref }}
          region: ${{ vars.REGION }}
          group: ${{ secrets.FEAT_RESOURCE_GROUP }}
          credentials: ${{ secrets.AZURE_FEAT_CREDENTIALS }}
          acr: ${{ secrets.ACR_FEAT_PASSWORD }}
          webapp: ${{ matrix.webapp }}

  # 4. Micro-services Functions deployments
  functions:
    name: Functions ⚡
    needs: [setup, database, webapp]
    environment: ${{ needs.setup.outputs.environment }}
    runs-on: [self-hosted, DTFS, deployment]

    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}

    strategy:
      max-parallel: 2
      # Do not cancel in-progress jobs upon failure
      fail-fast: false
      # Single dimension matrix
      matrix:
        functions: ['acbs']



    steps:
      - name: Repository 🗂️
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.deployment_ref }}

      - name: Deploy ⚡
        uses: ./.github/actions/functions
        with:
          branch: ${{ needs.setup.outputs.deployment_ref }}
          sha: ${{ needs.setup.outputs.deployment_ref }}
          region: ${{ vars.REGION }}
          group: ${{ secrets.FEAT_RESOURCE_GROUP }}
          credentials: ${{ secrets.AZURE_FEAT_CREDENTIALS }}
          acr: ${{ secrets.ACR_FEAT_PASSWORD }}
          functions: ${{ matrix.functions }}

  # 5. Notification
  notify:
    name: Notification 🔔
    needs: [setup, database, webapp, functions]
    environment: ${{ needs.setup.outputs.environment }}
    runs-on: [self-hosted, DTFS, deployment]

    steps:

      - name: Repository 🗂️
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.deployment_ref }}
      - name: Notification 🔔
        uses: ./.github/actions/notify
        with:
          webhook: ${{ secrets.MSTEAMS_WEBHOOK }}
          content: |
            {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "00703c",
              "title": "🚀 ${{ needs.setup.outputs.deployment_branch }} : ${{ needs.setup.outputs.environment }}",
              "summary": "Deployed ${{ needs.setup.outputs.deployment_branch }} branch to ${{ needs.setup.outputs.environment }} DTFS environment",
              "sections": [
                {
                  "activityTitle": "Branch deployment",
                  "activitySubtitle": "Deployed **${{ needs.setup.outputs.deployment_branch }}** branch to **${{ needs.setup.outputs.environment }}** DTFS environment.",
                  "facts": [
                    {
                      "name": "Branch",
                      "value": "${{ needs.setup.outputs.deployment_branch }}"
                    },
                    {
                      "name": "Environment",
                      "value": "${{ needs.setup.outputs.environment }}"
                    },
                    {
                      "name": "Commit",
                      "value": "${{ needs.setup.outputs.deployment_ref }}"
                    },
                    {
                      "name": "Status",
                      "value": "Successful"
                    }
                  ],
                  "markdown": true
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "Deployment",
                  "targets": [
                    {
                      "os": "default",
                      "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

